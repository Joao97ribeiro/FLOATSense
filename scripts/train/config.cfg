# ================================
# Data
# ================================
--dataset_dir=data/FLOATSense
--tower=opt2
--train_split=train
--test_split=test

# ================================
# Task: fore-aft moment at the 11 gauges, z/H as an input channel
# ================================
--directions=fa
--height_targets=True
--min_time=400
--max_time=1000
--lowpass=True
--lowpass_hz=3.0
--lowpass_order=4

# ================================
# Training recipe (identical for every model)
# ================================
--crop_length=4096
--batch_size=16
--learning_rate=1e-3
--num_epochs=50
--num_workers=4
--seed=0

# ================================
# Damage metric (DNV-RP-C203 bilinear S-N curve)
# ================================
--sn_intercepts_log10=12.010,15.350
--sn_slopes=3,5

# ================================
# Output options
# ================================
--output_root=outputs/within
