# ================================
# Data
# ================================
--dataset_dir=data/FLOATSense
--tower=opt2
--train_split=train
--test_split=test
--direction=fa

# ================================
# Calibration (Pimenta et al., 2024)
# ================================
--min_time=400
--max_time=1000
--pad_seconds=50
--segment_length=4096
--lf_fit_band=0.01,0.05
--operating_power_kw=100
--band_hz=3.0

# ================================
# Damage metric
# ================================
--lowpass=True
--lowpass_hz=3.0
--lowpass_order=4
--sn_intercepts_log10=12.010,15.350
--sn_slopes=3,5

# ================================
# Output options
# ================================
--output_root=outputs/physics
